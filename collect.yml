name: marsad-update

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install requests

      - name: Verify sources when the list changes
        run: |
          if [ ! -f sources.verified.json ] || [ sources.json -nt sources.verified.json ]; then
            echo "sources.json changed - running discovery"
            python collector.py verify || true
          else
            echo "no change - skipping verify"
          fi

      - name: Collect news
        run: python collector.py run --since 6h || true

      - name: Generate analysis sheets
        run: python analyst.py || true

      - name: Publish to website
        run: python publish.py

      - name: Save results
        run: |
          git config user.name "marsad-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data collector.state.json || true
          git diff --staged --quiet || git commit -m "auto update"
          git push
